<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#2F4A3A; --green-2:#46654F; --sage:#E6ECE4;
    --blush:#E9C9C1; --blush-2:#F7ECE8;
    --cream:#FBF8F3; --ink:#24302A; --muted:#7A847D; --line:#E2DED6;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:"Heebo",Arial,sans-serif;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:580px;margin:0 auto;padding:0 16px 56px}

  /* ---------- כותרת ---------- */
  .hero{position:relative;text-align:center;padding:28px 16px 30px;margin:0 -16px 22px;
        background:linear-gradient(180deg,var(--blush-2) 0%,var(--cream) 100%)}
  .hero .mark{width:76px;height:76px;margin:0 auto 12px;border-radius:50%;
        background:#fff;display:grid;place-items:center;font-size:32px;
        box-shadow:0 6px 20px rgba(47,74,58,.10)}
  .hero .bsd{position:absolute;top:12px;right:16px;font-size:14px;font-weight:600;color:var(--green)}
  .hero .brand-logo{display:block;width:min(180px,50vw);height:auto;margin:0 auto 4px}
  .hero h1{font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:34px;
        margin:0;color:var(--green);letter-spacing:.5px}
  .hero .addr{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:15px;font-weight:500;
        color:var(--green-2);background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:999px;
        padding:6px 14px;cursor:pointer}
  .hero .addr:active{transform:scale(.98)}
  .sheet-bg{position:fixed;inset:0;background:rgba(36,48,42,.35);opacity:0;pointer-events:none;transition:.2s;z-index:50}
  .sheet{position:fixed;right:0;left:0;bottom:0;max-width:580px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;
        padding:10px 18px 26px;transform:translateY(105%);transition:transform .25s ease;z-index:51}
  .sheet.open{transform:none}.sheet-bg.open{opacity:1;pointer-events:auto}
  .sheet .grab{width:40px;height:4px;border-radius:4px;background:#DDD;margin:0 auto 14px}
  .sheet h3{margin:0 0 4px;text-align:center;font-family:"Frank Ruhl Libre",serif;color:var(--green);font-size:20px;font-weight:500}
  .sheet p{margin:0 0 14px;text-align:center;color:var(--muted);font-size:14px}
  .nav-opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--radius);background:var(--cream);
        color:var(--ink);text-decoration:none;font-size:16px;font-weight:500;margin-bottom:8px}
  .nav-opt .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
  .nav-cancel{width:100%;margin-top:4px;padding:13px;border:0;background:none;font:inherit;font-size:16px;color:var(--muted);cursor:pointer}
  .hero .divider{width:46px;height:2px;background:var(--blush);margin:16px auto 12px;border-radius:2px}
  .hero p{margin:0;color:var(--muted);font-size:15px}

  /* ---------- כרטיסי שלבים ---------- */
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 18px 20px;
        margin-bottom:16px;box-shadow:0 2px 10px rgba(36,48,42,.04)}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .step{flex:none;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;
        display:grid;place-items:center;font-size:14px;font-weight:600}
  .card-head h2{margin:0;font-family:"Frank Ruhl Libre",serif;font-size:21px;font-weight:500;color:var(--green)}

  /* ---------- שדות ---------- */
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
  .c12{grid-column:span 12}.c6{grid-column:span 6}.c8{grid-column:span 8}.c4{grid-column:span 4}.c3{grid-column:span 3}
  @media (max-width:420px){ .c6{grid-column:span 12} .c8{grid-column:span 12} .c4{grid-column:span 6} .c3{grid-column:span 6} }

  .field{position:relative}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--green-2);margin:0 2px 6px}
  .field label .req{color:#C0645A;margin-right:2px}
  .field input,.field textarea{
    width:100%;height:50px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);
    background:var(--cream);border:1.5px solid transparent;border-radius:var(--radius);
    transition:border-color .15s,background .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
  .field textarea{height:auto;min-height:120px;padding:14px;line-height:1.6;resize:vertical}
  .field input::placeholder,.field textarea::placeholder{color:#AEB4AF}
  .field input:focus,.field textarea:focus{outline:none;background:#fff;border-color:var(--green-2);
    box-shadow:0 0 0 4px rgba(70,101,79,.12)}
  .field.invalid input,.field.invalid textarea{border-color:#C0645A;background:#FDF3F1}
  .field input[type=date],.field input[type=time]{text-align:right;min-width:0}
  .hint{font-size:12.5px;color:var(--muted);margin:6px 2px 0}
  .counter{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--muted)}

  /* ---------- השלמה אוטומטית ---------- */
  .ac-list{position:absolute;top:100%;right:0;left:0;margin-top:6px;z-index:20;background:#fff;
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 12px 30px rgba(36,48,42,.14);
    overflow:hidden;display:none;max-height:260px;overflow-y:auto}
  .ac-list.open{display:block}
  .ac-item{padding:12px 14px;font-size:16px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .ac-item::before{content:"📍";font-size:13px;opacity:.7}
  .ac-item + .ac-item{border-top:1px solid #F1EEE8}
  .ac-item.active,.ac-item:hover{background:var(--sage)}
  .ac-item b{color:var(--green)}

  /* ---------- כפתורי בחירה (צ'יפים) ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;
        padding:10px 16px;font:inherit;font-size:15px;cursor:pointer;transition:all .15s;line-height:1.2}
  .chip small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff}
  .chip.on small{color:#DCE6DE}
  .slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .slots .chip{border-radius:var(--radius);text-align:center;padding:12px 8px}
  .chips.small .chip{padding:7px 13px;font-size:14px;background:var(--blush-2);border-color:transparent;color:var(--green)}
  .chips.small .chip:active{transform:scale(.97)}

  /* ---------- מתג ---------- */
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;
          background:var(--cream);border-radius:var(--radius);padding:13px 14px;cursor:pointer;margin-top:4px}
  .toggle span{font-size:15px}
  .toggle input{display:none}
  .sw{flex:none;width:44px;height:26px;border-radius:99px;background:#D6D9D4;position:relative;transition:.2s}
  .sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
             background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
  .toggle input:checked + .sw{background:var(--green)}
  .toggle input:checked + .sw::after{right:21px}

  /* ---------- שליחה ---------- */
  .submit{width:100%;height:58px;border:0;border-radius:16px;background:var(--green);color:#fff;
    font:inherit;font-size:19px;font-weight:600;cursor:pointer;box-shadow:0 8px 22px rgba(47,74,58,.25);
    transition:transform .1s,opacity .2s}
  .submit:active{transform:scale(.99)}
  .submit:disabled{opacity:.65;cursor:wait}
  .error{color:#B04C42;text-align:center;font-size:14px;min-height:22px;margin-top:12px}

  .done{text-align:center;padding:70px 20px}
  .done .mark{font-size:60px}
  .done h2{font-family:"Frank Ruhl Libre",serif;color:var(--green);font-size:28px;margin:14px 0 8px}
  .done p{color:var(--muted);margin:0}
</style>
</head>

<script>
/* ===== רשימת יישובים להשלמה אוטומטית ===== */
let CITIES = ["אבו גוש","אבן יהודה","אופקים","אור יהודה","אור עקיבא","אורנית","אזור","אילת","אלונה","אלעד","אלפי מנשה","אלקנה","אפרת","אריאל","אשדוד","אשקלון","באקה אל-גרבייה","באר טוביה","באר יעקב","באר שבע","בית אריה","בית דגן","בית שאן","בית שמש","בית יצחק","ביתר עילית","בני ברק","בני עי\"ש","בנימינה-גבעת עדה","בסמ\"ה","בת חפר","בת ים","גבעת ברנר","גבעת זאב","גבעת חיים","גבעת עדה","גבעת שמואל","גבעתיים","גדרה","גן יבנה","גן רווה","גני תקווה","דאלית אל-כרמל","דימונה","הוד השרון","הרצליה","זכרון יעקב","חדרה","חולון","חיפה","חריש","טבריה","טייבה","טירה","טירת כרמל","טמרה","יבנה","יהוד-מונוסון","יוקנעם עילית","יסוד המעלה","ירוחם","ירושלים","ירכא","כוכב יאיר-צור יגאל","כפר ויתקין","כפר יונה","כפר סבא","כפר קאסם","כפר שמריהו","כפר תבור","כפר יהושע","כרמיאל","להבים","לוד","מבשרת ציון","מגדל העמק","מגדל","מודיעין עילית","מודיעין-מכבים-רעות","מזכרת בתיה","מטולה","מכמורת","מעלה אדומים","מעלות-תרשיחא","מצפה רמון","משמר השרון","נהריה","נוף הגליל","נס ציונה","נצרת","נשר","נתיבות","נתניה","סביון","סח'נין","עכו","עין ורד","עין שמר","עמק חפר","עפולה","עראבה","ערד","עתלית","פרדס חנה-כרכור","פרדסיה","פתח תקווה","צור משה","צור הדסה","צורן-קדימה","קדימה-צורן","קיסריה","קצרין","קריית אונו","קריית אתא","קריית ביאליק","קריית גת","קריית טבעון","קריית ים","קריית מוצקין","קריית מלאכי","קריית עקרון","קריית שמונה","קרני שומרון","ראש העין","ראש פינה","ראשון לציון","רהט","רחובות","רמלה","רמת גן","רמת השרון","רמת ישי","רמת פולג","רעננה","רשפון","שדרות","שוהם","שלומי","שערי תקווה","שפרעם","תל אביב-יפו","תל מונד","תמרה"];

/* כתובת השרת בגוגל (Apps Script) שבונה את קובץ ה-Word ושולח את המייל */
const API_URL = 'https://script.google.com/macros/s/AKfycbyGdxYGfGXOSBjHxPtYEr63xJl5dgrXEbOQIcs_HhrQuxkxdik-G6EvaHQIcAEkLtzm/exec';

const $ = id => document.getElementById(id);
const LOGO_BIG = '<img src="' + document.querySelector('.brand-logo').src + '" alt="" style="width:170px;height:auto">';

/* טעינת הרשימה המלאה (כ-1,300 יישובים, כולל מושבים וקיבוצים) מהמאגר הממשלתי */
function mergeCities(list) {
  if (!Array.isArray(list) || list.length < 100) return false;
  const all = new Set(list.concat(CITIES));
  CITIES = [...all].sort((a, b) => a.localeCompare(b, 'he'));
  return true;
}
function loadCitiesFromBrowser() {
  fetch('https://data.gov.il/api/3/action/datastore_search?resource_id=5c78e9fa-c2e2-4771-93ff-7f400a12f7ba&limit=5000')
    .then(r => r.json())
    .then(j => {
      const recs = j.result.records, key = Object.keys(recs[0]).find(k => k.replace(/[_\s]/g, '') === 'שםישוב');
      mergeCities(recs.map(r => String(r[key] || '').replace(/\s+/g, ' ').trim().replace(/\s*-\s*/g, '-'))
                      .filter(n => n && n !== 'לא רשום'));
    }).catch(() => {});
}
fetch(API_URL + '?action=cities')
  .then(r => r.json())
  .then(list => { if (!mergeCities(list)) loadCitiesFromBrowser(); })
  .catch(loadCitiesFromBrowser);
const f = $('f'), btn = $('btn'), err = $('err');

/* ===== השלמה אוטומטית ===== */
(function () {
  const input = $('city'), list = $('cityList');
  let items = [], idx = -1;
  const norm = s => s.replace(/["'״׳\-\s]/g, '');

  function render(q) {
    const nq = norm(q);
    if (!nq) { close(); return; }
    const starts = CITIES.filter(c => norm(c).startsWith(nq));
    const inside = CITIES.filter(c => !norm(c).startsWith(nq) && norm(c).includes(nq));
    items = starts.concat(inside).slice(0, 7);
    if (!items.length || (items.length === 1 && items[0] === q)) { close(); return; }
    idx = -1;
    list.innerHTML = items.map((c, i) => {
      const at = c.indexOf(q);
      const label = at >= 0 ? c.slice(0, at) + '<b>' + c.slice(at, at + q.length) + '</b>' + c.slice(at + q.length) : c;
      return '<div class="ac-item" data-i="' + i + '"><span>' + label + '</span></div>';
    }).join('');
    list.classList.add('open');
  }
  function close() { list.classList.remove('open'); idx = -1; }
  function pick(i) { input.value = items[i]; close(); input.closest('.field').classList.remove('invalid');
                     f.street.focus(); }
  function highlight() { [...list.children].forEach((el, i) => el.classList.toggle('active', i === idx)); }

  input.addEventListener('input', () => render(input.value.trim()));
  input.addEventListener('focus', () => input.value && render(input.value.trim()));
  input.addEventListener('blur', () => setTimeout(close, 150));
  input.addEventListener('keydown', e => {
    if (!list.classList.contains('open')) return;
    if (e.key === 'ArrowDown') { idx = Math.min(idx + 1, items.length - 1); highlight(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { idx = Math.max(idx - 1, 0); highlight(); e.preventDefault(); }
    else if (e.key === 'Enter' && idx >= 0) { pick(idx); e.preventDefault(); }
    else if (e.key === 'Escape') close();
  });
  list.addEventListener('mousedown', e => {
    const el = e.target.closest('.ac-item'); if (el) { e.preventDefault(); pick(+el.dataset.i); }
  });
})();


/* ===== ניווט לחנות ===== */
function sheet(open) { $('sheet').classList.toggle('open', open); $('sheetBg').classList.toggle('open', open); }
$('addrBtn').addEventListener('click', () => sheet(true));
$('sheetBg').addEventListener('click', () => sheet(false));
$('sheetClose').addEventListener('click', () => sheet(false));
document.querySelectorAll('.nav-opt').forEach(a => a.addEventListener('click', () => setTimeout(() => sheet(false), 300)));

/* ===== תאריך ===== */
const dateInput = $('deliveryDate');
const iso = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
dateInput.min = iso(new Date());

/* ===== ברכה ===== */
const g = $('greeting');
g.addEventListener('input', () => $('cnt').textContent = g.value.length);
$('quick').addEventListener('click', e => {
  const ch = e.target.closest('.chip'); if (!ch) return;
  g.value = (g.value.trim() ? g.value.trim() + '\n' : '') + ch.textContent;
  g.dispatchEvent(new Event('input')); g.focus();
});
$('anonymous').addEventListener('change', e => {
  $('signature').disabled = e.target.checked;
  $('signature').style.opacity = e.target.checked ? .45 : 1;
});

/* ===== שליחה ===== */
f.addEventListener('input', e => e.target.closest('.field')?.classList.remove('invalid'));
f.addEventListener('submit', e => {
  e.preventDefault(); err.textContent = '';
  const missing = [...f.querySelectorAll('[required]')].filter(el => !el.value.trim());
  f.querySelectorAll('.field').forEach(x => x.classList.remove('invalid'));
  missing.forEach(el => el.closest('.field').classList.add('invalid'));
  if (missing.length) {
    missing[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
    err.textContent = 'נא להשלים את השדות המסומנים';
    return;
  }
  const data = {};
  new FormData(f).forEach((v, k) => data[k] = v);
  data.anonymous = $('anonymous').checked;
  if (data.anonymous) data.signature = '';

  btn.disabled = true; btn.textContent = 'שולחים…';
  const fail = () => {
    btn.disabled = false; btn.textContent = 'שליחת ההזמנה';
    err.textContent = 'משהו השתבש בשליחה. אנא נסו שוב.';
  };
  fetch(API_URL, { method: 'POST', body: JSON.stringify(data) })
    .then(r => r.json())
    .then(res => {
      if (!res.ok) return fail();
      window.scrollTo(0, 0);
      $('app').innerHTML =
        '<div class="done"><div class="mark">' + LOGO_BIG + '</div><h2>תודה, ההזמנה התקבלה!</h2>' +
        '<p>הזר שלכם כבר בדרך להיות מוכן.</p></div>';
    })
    .catch(fail);
});
</script>
